[package]
name = "kr-kubelet"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kr-sys = { path = "../kr-sys" }
kr-rt = { path = "../kr-rt" }
kr-fmt = { path = "../kr-fmt" }
kr-apiserver = { path = "../kr-apiserver" }
kr-runtime = { path = "../kr-runtime" }
kr-net = { path = "../kr-net" }
kr-crypto = { path = "../kr-crypto" }

[dev-dependencies]
# `host` drops _start/panic handler/allocator/mem* so the std test harness can link (ADR-015).
kr-rt = { path = "../kr-rt", features = ["host"] }
