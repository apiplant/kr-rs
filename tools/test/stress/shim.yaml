apiVersion: v1
kind: Pod
metadata: {name: exit0}
spec:
  nodeName: kr2
  restartPolicy: Never
  containers: [{name: c, image: alpine:3.20, command: [sh, -c, "sleep 50; echo finished-ok"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: exit3}
spec:
  nodeName: kr2
  restartPolicy: Never
  containers: [{name: c, image: alpine:3.20, command: [sh, -c, "sleep 50; exit 3"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: ttyp}
spec:
  nodeName: kr2
  containers: [{name: c, image: alpine:3.20, tty: true, stdin: true, command: [sh, -c, "i=0; while true; do echo tick-$i; i=$((i+1)); sleep 1; done"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: stdinp}
spec:
  nodeName: kr2
  containers: [{name: c, image: alpine:3.20, stdin: true, command: [sh, -c, "while read l; do echo got:$l; done; echo stdin-closed"]}]
