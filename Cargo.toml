[workspace]
resolver = "2"
members = ["crates/kr-sys", "crates/kr-rt", "crates/kr-fmt", "crates/kr-archive", "crates/kr-crypto", "crates/kr-net", "crates/kr-apiserver", "crates/kr-runtime", "crates/kr-kubelet", "crates/kr-store", "crates/kr-controllers", "crates/kr"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
